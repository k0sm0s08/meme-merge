name: Prepare Yandex Games upload

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yandex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and check both publishing targets
        run: |
          npm run build
          npm run check:build
          npm run build:yandex
          npm run check:yandex
      - name: Test gameplay, contours, publishing paths and Yandex ad callbacks
        run: |
          npm test
          npm run test:production
          npm run test:yandex
      - name: Upload the game archive for the Yandex console
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yandex-games-upload
          path: dist-yandex/
          if-no-files-found: error
          retention-days: 30
      - name: Upload catalogue icon, cover, screenshots and listing text
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yandex-card-materials
          path: publishing/yandex/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yandex-test-reports
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
